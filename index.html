<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Closing...</title>
  </head>
  <body>
    <script>
      // Notify parent window (main app)
      if (window.opener) {
        window.opener.postMessage({ status: 'done' }, '*');
      }
      Close the popup/tab after 1 second
      setTimeout(() => {
        window.close();
      }, 1000);
    </script>
  </body>
</html>
